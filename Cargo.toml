[package]
name = "scanevm"
version = "0.1.0"
edition = "2021"
description = "A fast CLI for fetching verified smart contract source code and querying blockchain data across EVM chains."
license = "MIT"
repository = "https://github.com/lxhyl/scanevm"
homepage = "https://github.com/lxhyl/scanevm"
readme = "README.md"
keywords = ["ethereum", "etherscan", "evm", "blockchain", "cli"]
categories = ["command-line-utilities", "cryptography::cryptocurrencies"]

[[bin]]
name = "scanevm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
colored = "2"
tabled = "0.15"
dirs = "5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
